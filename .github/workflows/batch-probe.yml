name: batch-probe

on:
  workflow_dispatch:
    inputs:
      pass:
        description: '解密密码（仅本次运行使用，不落盘）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install dnspython

      - name: Decrypt sample list
        env:
          PROBE_PASS: ${{ inputs.pass }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in data/probe_sample.enc -out /tmp/sample.txt \
            -pass "pass:$PROBE_PASS"
          N=$(wc -l < /tmp/sample.txt)
          echo "decrypted $N addresses"
          if [ "$N" -lt 100 ]; then echo "::error::decrypt failed"; exit 1; fi

      - name: Batch probe
        run: |
          python tools/batch_probe.py /tmp/sample.txt 2>&1 | tee /tmp/probe.out
          shred -u /tmp/sample.txt 2>/dev/null || rm -f /tmp/sample.txt

      - name: Publish stats
        run: |
          {
            echo "# Batch probe result"
            echo
            echo "run: $(date -u +%Y-%m-%dT%H:%M:%SZ)  ·  sample: 1000 random unsent @163.com"
            echo
            echo '```'
            cat /tmp/probe.out
            echo '```'
          } > BATCH-PROBE-RESULT.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BATCH-PROBE-RESULT.md
          git commit -m "chore: batch probe stats [skip ci]" || echo "no change"
          git push
